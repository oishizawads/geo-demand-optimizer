[project]
name = "geo-demand-optimizer"
version = "0.1.0"
description = "需要地点と供給拠点を地図上で可視化し、最近傍割当と容量不足を示す小型 Streamlit アプリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.31",
    "pandas>=2.0",
    "folium>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
