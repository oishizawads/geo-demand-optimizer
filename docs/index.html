<script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";
mount({"requirements": ["folium", "numpy", "pandas"], "entrypoint": "app/streamlit_app.py", "files": {"app/streamlit_app.py": "\"\"\"Geo Demand Optimizer — Streamlit エントリポイント。\n\n画面は薄く保ち、計算ロジックは src/ に委譲する。\n実行: streamlit run app/streamlit_app.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport folium\nimport pandas as pd\nimport streamlit as st\nimport streamlit.components.v1 as components\n\nfrom src.assignment import assign_nearest_with_capacity, facility_summary\nfrom src.data import scale_demand\nfrom src.models import AssignmentResult, DemandPoint, SupplyFacility\nfrom src.scenarios import build_scenarios, scenario_order\n\n\n_MAP_HEIGHT = 560\n_N_DEMAND_MIN = 6\n_N_DEMAND_MAX = 60\n_N_DEMAND_DEFAULT = 24\n\n\n# --- キャッシュ付き計算 -----------------------------------------------------\n\n\n@st.cache_data\ndef _load_scenarios(n_demand: int) -> dict:\n    \"\"\"シナリオ群を構築してキャッシュする。\"\"\"\n    return build_scenarios(n_demand)\n\n\n@st.cache_data\ndef _compute(\n    n_demand: int, scenario_key: str, demand_scale: float\n) -> tuple[AssignmentResult, list[DemandPoint], list[SupplyFacility]]:\n    \"\"\"指定条件で割当を計算し、結果と入力データを返す。\"\"\"\n    scenarios = build_scenarios(n_demand)\n    sc = scenarios[scenario_key]\n    points = (\n        scale_demand(sc.demand_points, demand_scale)\n        if demand_scale != 1.0\n        else list(sc.demand_points)\n    )\n    result = assign_nearest_with_capacity(points, sc.facilities)\n    return result, points, list(sc.facilities)\n\n\n# --- 地図構築 ---------------------------------------------------------------\n\n\ndef _build_map(\n    points: list[DemandPoint],\n    facilities: list[SupplyFacility],\n    result: AssignmentResult,\n) -> folium.Map:\n    \"\"\"需要地点・拠点・割当線を描いた folium 地図を返す。\"\"\"\n    all_lats = [p.lat for p in points] + [f.lat for f in facilities]\n    all_lons = [p.lon for p in points] + [f.lon for f in facilities]\n    if not all_lats:\n        center = [35.5, 140.0]\n    else:\n        center = [sum(all_lats) / len(all_lats), sum(all_lons) / len(all_lons)]\n\n    fmap = folium.Map(location=center, zoom_start=10, tiles=\"OpenStreetMap\")\n\n    fac_by_id = {f.id: f for f in facilities}\n    pt_by_id = {p.id: p for p in points}\n\n    # 割当線（需要→拠点）\n    for a in result.assignments:\n        p = pt_by_id.get(a.demand_id)\n        f = fac_by_id.get(a.facility_id)\n        if p is None or f is None:\n            continue\n        folium.PolyLine(\n            [(p.lat, p.lon), (f.lat, f.lon)],\n            color=\"#7a7a7a\",\n            weight=1,\n            opacity=0.45,\n        ).add_to(fmap)\n\n    # 需要地点（青い円、サイズは需要量におおむね比例）\n    for p in points:\n        radius = max(3.0, min(13.0, p.demand / 55.0))\n        folium.CircleMarker(\n            location=[p.lat, p.lon],\n            radius=radius,\n            color=\"#2b7fd4\",\n            fill=True,\n            fill_color=\"#2b7fd4\",\n            fill_opacity=0.55,\n            popup=folium.Popup(\n                f\"<b>{p.name}</b><br>需要: {p.demand:.0f}\", max_width=180\n            ),\n            tooltip=f\"{p.name} / 需要 {p.demand:.0f}\",\n        ).add_to(fmap)\n\n    # 供給拠点（マーカー、容量ゼロは灰・満杯は赤・それ以外は緑）\n    for f in facilities:\n        cap = max(0.0, f.capacity)\n        load = result.facility_loads.get(f.id, 0.0)\n        if cap == 0:\n            color = \"lightgray\"\n            status = \"休止(容量0)\"\n        elif load >= cap:\n            color = \"red\"\n            status = \"満杯\"\n        else:\n            color = \"green\"\n            status = \"稼働\"\n        folium.Marker(\n            location=[f.lat, f.lon],\n            popup=folium.Popup(\n                f\"<b>{f.name}</b><br>容量: {cap:.0f}<br>割当: {load:.0f}<br>状態: {status}\",\n                max_width=200,\n            ),\n            tooltip=f\"{f.name} / {status}\",\n            icon=folium.Icon(color=color, icon=\"info-sign\"),\n        ).add_to(fmap)\n\n    return fmap\n\n\n# --- 指標カード -------------------------------------------------------------\n\n\ndef _kpi_row(result: AssignmentResult) -> None:\n    \"\"\"主要指標をカードで並べる（モバイルでは縦に並ぶ）。\"\"\"\n    c1, c2, c3, c4, c5 = st.columns(5)\n    c1.metric(\"総需要\", f\"{result.total_demand:,.0f}\")\n    c2.metric(\"総容量\", f\"{result.total_capacity:,.0f}\")\n    c3.metric(\"割当済\", f\"{result.total_assigned:,.0f}\")\n    c4.metric(\"未割当(不足)\", f\"{result.total_unassigned:,.0f}\")\n    c5.metric(\"利用率\", f\"{result.utilization_rate:.1%}\")\n\n\n# --- 画面本体 ---------------------------------------------------------------\n\n\ndef main() -> None:\n    st.set_page_config(\n        page_title=\"Geo Demand Optimizer\",\n        page_icon=\"🗺️\",\n        layout=\"wide\",\n        initial_sidebar_state=\"expanded\",\n    )\n    from src.brand import apply_brand, hero\n    apply_brand(st)\n    hero(st, \"Geospatial Optimization\", \"Geo Demand Optimizer\", \"需要地点と供給拠点を地図上で見せ、割当と容量不足を可視化します。\")\n    st.caption(\n        \"需要地点と供給拠点を地図上で可視化し、最近傍貪易割当と容量不足を示すMVP。\"\n        \"データは全て架空（seed固定の合成データ）。\"\n    )\n\n    # サイドバー: シナリオと地点数\n    st.sidebar.header(\"設定\")\n    n_demand = st.sidebar.slider(\n        \"需要地点数\", _N_DEMAND_MIN, _N_DEMAND_MAX, _N_DEMAND_DEFAULT, step=2\n    )\n    scenarios = _load_scenarios(n_demand)\n    keys = scenario_order()\n    scenario_key = st.sidebar.radio(\n        \"シナリオ\",\n        keys,\n        format_func=lambda k: f\"{scenarios[k].name} — {scenarios[k].description}\",\n    )\n    st.sidebar.divider()\n    st.sidebar.markdown(\n        \"**データについて**: 全地点は seed 固定の仮想データです。\"\n        \"実在クライアントの計画とは無関係です。\"\n    )\n\n    sc = scenarios[scenario_key]\n\n    # 現在のスケール（ボタンで更新）\n    if \"demand_scale\" not in st.session_state:\n        st.session_state[\"demand_scale\"] = 1.0\n\n    # タブ\n    tab_map, tab_settings, tab_assign, tab_gap, tab_cmp = st.tabs(\n        [\"Map\", \"Demand Settings\", \"Assignment Result\", \"Capacity Gap\", \"Scenario Comparison\"]\n    )\n\n    # Demand Settings タブでスケールを調整 + 再計算ボタン\n    with tab_settings:\n        st.subheader(\"需要設定\")\n        st.markdown(f\"**シナリオ**: {sc.name} — {sc.description}\")\n        st.markdown(f\"**需要地点数**: {len(sc.demand_points)}  / **供給拠点数**: {len(sc.facilities)}\")\n        new_scale = st.slider(\n            \"需要スケール\",\n            min_value=0.5,\n            max_value=2.0,\n            value=st.session_state[\"demand_scale\"],\n            step=0.1,\n            help=\"シナリオの需要量にこの倍率を掛けます。適用ボタンで再割当します。\",\n        )\n        if st.button(\"割当を再計算\", type=\"primary\"):\n            st.session_state[\"demand_scale\"] = new_scale\n            st.success(\"需要スケールを適用し、割当を再計算しました。\")\n        st.caption(\n            \"ボタンは何度押しても同じ入力なら同じ結果になります（状態は壊れません）。\"\n        )\n\n    demand_scale = st.session_state[\"demand_scale\"]\n    result, points, facilities = _compute(n_demand, scenario_key, demand_scale)\n\n    # Map タブ\n    with tab_map:\n        _kpi_row(result)\n        fmap = _build_map(points, facilities, result)\n        components.html(fmap._repr_html_(), height=_MAP_HEIGHT)\n        st.caption(\n            \"青円=需要地点（大きさは需要量）/ 緑マーカー=稼働拠点 / 赤=満杯 / 灰=容量0の休止拠点 / 線=割当\"\n        )\n\n    # Assignment Result タブ\n    with tab_assign:\n        _kpi_row(result)\n        st.subheader(\"拠点別サマリ\")\n        fac_rows = facility_summary(result)\n        st.dataframe(pd.DataFrame(fac_rows), use_container_width=True, hide_index=True)\n\n        st.subheader(\"需要地点別の割当\")\n        pt_by_id = {p.id: p for p in points}\n        rows = []\n        for a in result.assignments:\n            p = pt_by_id.get(a.demand_id)\n            rows.append(\n                {\n                    \"需要地点\": p.name if p else a.demand_id,\n                    \"割当先拠点\": a.facility_id,\n                    \"割当量\": round(a.amount, 1),\n                    \"距離(km)\": round(a.distance_km, 2),\n                }\n            )\n        for u in result.unassigned:\n            p = pt_by_id.get(u.demand_id)\n            rows.append(\n                {\n                    \"需要地点\": p.name if p else u.demand_id,\n                    \"割当先拠点\": \"（未割当）\",\n                    \"割当量\": 0.0,\n                    \"距離(km)\": round(u.nearest_distance_km, 2),\n                }\n            )\n        st.dataframe(pd.DataFrame(rows), use_container_width=True, hide_index=True)\n\n    # Capacity Gap タブ\n    with tab_gap:\n        _kpi_row(result)\n        st.subheader(\"容量不足（未割当需要）\")\n        if not result.unassigned:\n            st.success(\"全ての需要を割当てました。容量不足はありません。\")\n        else:\n            gap_total = result.total_unassigned\n            st.error(f\"未割当需要 合計: {gap_total:,.0f}\")\n            gap_rows = []\n            pt_by_id = {p.id: p for p in points}\n            for u in result.unassigned:\n                p = pt_by_id.get(u.demand_id)\n                gap_rows.append(\n                    {\n                        \"需要地点\": p.name if p else u.demand_id,\n                        \"未割当量\": round(u.amount, 1),\n                        \"最寄り拠点\": u.nearest_facility_id,\n                        \"最寄り拠点まで(km)\": round(u.nearest_distance_km, 2),\n                    }\n                )\n            st.dataframe(pd.DataFrame(gap_rows), use_container_width=True, hide_index=True)\n\n        st.subheader(\"拠点別 余剰容量\")\n        surplus_rows = [r for r in facility_summary(result) if r[\"余剰\"] > 0]\n        if surplus_rows:\n            st.dataframe(pd.DataFrame(surplus_rows), use_container_width=True, hide_index=True)\n        else:\n            st.info(\"余剰容量のある拠点はありません（全拠点が満杯または容量0）。\")\n\n    # Scenario Comparison タブ\n    with tab_cmp:\n        st.subheader(\"全シナリオ比較\")\n        cmp_rows = []\n        for k in keys:\n            s = scenarios[k]\n            r, _, _ = _compute(n_demand, k, 1.0)\n            cmp_rows.append(\n                {\n                    \"シナリオ\": s.name,\n                    \"需要地点\": len(s.demand_points),\n                    \"拠点数\": len(s.facilities),\n                    \"総需要\": round(r.total_demand, 0),\n                    \"総容量\": round(r.total_capacity, 0),\n                    \"割当済\": round(r.total_assigned, 0),\n                    \"未割当\": round(r.total_unassigned, 0),\n                    \"利用率\": f\"{r.utilization_rate:.1%}\",\n                    \"平均距離(km)\": round(r.avg_distance_km, 2),\n                }\n            )\n        st.dataframe(pd.DataFrame(cmp_rows), use_container_width=True, hide_index=True)\n        st.caption(\n            \"シナリオを切り替えると、未割当・利用率・平均距離が変化します。\"\n            \"ピーク需要では不足が拡大し、拠点追加では不足が解消されることを確認できます。\"\n        )\n\n\nif __name__ == \"__main__\":\n    main()\n", "src/__init__.py": "", "src/assignment.py": "\"\"\"割当・最適化ロジック。\n\n需要地点を容量制約付きで最寄りの供給拠点に割当てる貪欲法（簡易最適化）。\n計算ロジックはここに集約し、Streamlit 画面からは呼ぶだけにする。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom .models import (\n    Assignment,\n    AssignmentResult,\n    DemandPoint,\n    SupplyFacility,\n    Unassigned,\n)\n\n_EARTH_RADIUS_KM = 6371.0088\n\n\ndef haversine_matrix(\n    demand_points: list[DemandPoint], facilities: list[SupplyFacility]\n) -> np.ndarray:\n    \"\"\"需要地点×拠点の haversine 距離行列(km)を返す。\n\n    numpy ベースのベクトル化実装（scipy の cdist haversine はバージョン依存があるため自前）。\n\n    Args:\n        demand_points: 需要地点リスト。\n        facilities: 供給拠点リスト。\n\n    Returns:\n        shape (n_demand, n_facility) の距離行列(km)。いずれかが空なら zeros。\n    \"\"\"\n    n_d = len(demand_points)\n    n_f = len(facilities)\n    if n_d == 0 or n_f == 0:\n        return np.zeros((n_d, n_f))\n    d_lat = np.radians(np.array([p.lat for p in demand_points]))[:, None]\n    d_lon = np.radians(np.array([p.lon for p in demand_points]))[:, None]\n    f_lat = np.radians(np.array([f.lat for f in facilities]))[None, :]\n    f_lon = np.radians(np.array([f.lon for f in facilities]))[None, :]\n    dlat = f_lat - d_lat\n    dlon = f_lon - d_lon\n    a = np.sin(dlat / 2.0) ** 2 + np.cos(d_lat) * np.cos(f_lat) * np.sin(dlon / 2.0) ** 2\n    a = np.clip(a, 0.0, 1.0)\n    return 2.0 * _EARTH_RADIUS_KM * np.arcsin(np.sqrt(a))\n\n\ndef _safe_capacity(f: SupplyFacility) -> float:\n    \"\"\"容量の負値を0にクリップする。\"\"\"\n    return max(0.0, float(f.capacity))\n\n\ndef _safe_demand(p: DemandPoint) -> float:\n    \"\"\"需要の負値を0にクリップする。\"\"\"\n    return max(0.0, float(p.demand))\n\n\ndef assign_nearest_with_capacity(\n    demand_points: list[DemandPoint],\n    facilities: list[SupplyFacility],\n) -> AssignmentResult:\n    \"\"\"容量制約付き最近傍貪欲割当を行う。\n\n    各需要地点を最も近い利用可能（残容量>0）拠点に全量割当てる。\n    需要量がどの拠点の残容量も超える場合は未割当（容量ギャップ）とする。\n    容量ゼロの拠点は利用不可として安全に扱う。\n\n    Args:\n        demand_points: 需要地点リスト。\n        facilities: 供給拠点リスト。\n\n    Returns:\n        割当結果。\n    \"\"\"\n    if not facilities:\n        # 拠点が無ければ全需要が未割当（最寄り拠点も無し）\n        return AssignmentResult(\n            unassigned=[\n                Unassigned(\n                    demand_id=p.id,\n                    amount=_safe_demand(p),\n                    nearest_facility_id=\"\",\n                    nearest_distance_km=0.0,\n                )\n                for p in demand_points\n            ],\n            facility_capacities={},\n        )\n    if not demand_points:\n        return AssignmentResult(\n            facility_capacities={f.id: _safe_capacity(f) for f in facilities}\n        )\n\n    dist = haversine_matrix(demand_points, facilities)\n    remaining = {f.id: _safe_capacity(f) for f in facilities}\n    capacities = dict(remaining)\n    id_to_fac = {f.id: f for f in facilities}\n\n    assignments: list[Assignment] = []\n    unassigned: list[Unassigned] = []\n    loads: dict[str, float] = {f.id: 0.0 for f in facilities}\n\n    # 需要量が大きい順に割当てる（大きい需要ほど拠点選択肢が限られるため優先）\n    order = sorted(\n        range(len(demand_points)),\n        key=lambda i: _safe_demand(demand_points[i]),\n        reverse=True,\n    )\n\n    for i in order:\n        point = demand_points[i]\n        need = _safe_demand(point)\n        if need <= 0:\n            continue\n\n        row = dist[i]\n        # 距離昇順の拠点インデックス\n        fac_order = np.argsort(row)\n        for fi in fac_order:\n            if need <= 0:\n                break\n            fac = facilities[fi]\n            if remaining[fac.id] <= 0:\n                continue\n            alloc = min(need, remaining[fac.id])\n            assignments.append(\n                Assignment(\n                    demand_id=point.id,\n                    facility_id=fac.id,\n                    amount=alloc,\n                    distance_km=float(row[fi]),\n                )\n            )\n            remaining[fac.id] -= alloc\n            loads[fac.id] += alloc\n            need -= alloc\n\n        if need > 0:\n            # 未割当残: 全拠点中の最寄りを参考情報として記録\n            nearest_idx = int(np.argmin(row))\n            nearest_fac = facilities[nearest_idx]\n            unassigned.append(\n                Unassigned(\n                    demand_id=point.id,\n                    amount=need,\n                    nearest_facility_id=nearest_fac.id,\n                    nearest_distance_km=float(row[nearest_idx]),\n                )\n            )\n\n    return AssignmentResult(\n        assignments=assignments,\n        unassigned=unassigned,\n        facility_loads=loads,\n        facility_capacities=capacities,\n    )\n\n\ndef facility_summary(result: AssignmentResult) -> list[dict]:\n    \"\"\"拠点別の容量・負荷・余剰・利用率を行データとして返す（表表示用）。\n\n    Args:\n        result: 割当結果。\n\n    Returns:\n        拠点ごとのサマリ辞書のリスト（id, name, capacity, load, surplus, utilization）。\n    \"\"\"\n    rows: list[dict] = []\n    for fid, cap in result.facility_capacities.items():\n        load = result.facility_loads.get(fid, 0.0)\n        surplus = max(0.0, cap - load)\n        util = (load / cap) if cap > 0 else 0.0\n        rows.append(\n            {\n                \"拠点ID\": fid,\n                \"拠点名\": fid,\n                \"容量\": round(cap, 1),\n                \"割当量\": round(load, 1),\n                \"余剰\": round(surplus, 1),\n                \"利用率\": round(util, 3),\n            }\n        )\n    return rows\n", "src/brand.py": "\"\"\"portfolio-hub と視覚言語を揃える共通ブランドテーマ（Streamlit 用）。\n\n- near-white グラデ背景 / slate 文字 / teal・blue アクセント\n- 半透明の白カード + blur / 8px 角丸 / uppercase キッカー + 大きな見出し\n\n外部依存なし。各アプリの ``streamlit_app.py`` から::\n\n    from src.brand import apply_brand, hero\n    apply_brand(st)          # set_page_config の後に一度だけ\n    hero(st, \"Kicker\", \"タイトル\", \"サブ説明\")\n\"\"\"\n\nfrom __future__ import annotations\n\n_BRAND_CSS = \"\"\"\n<style>\n@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');\n\n:root {\n  --bg:#f8fafc; --fg:#0f172a; --muted:rgba(15,23,42,0.66);\n  --surface:rgba(255,255,255,0.82); --line:rgba(15,23,42,0.12);\n  --accent:#0f766e; --accent2:#2563eb;\n  --shadow:0 18px 50px rgba(15,23,42,0.08);\n}\n\n/* typography（アイコンフォントは触らない） */\nhtml, body, .stApp, .stMarkdown, p, li, span, label,\nh1, h2, h3, h4, button, input, textarea, select,\n[data-testid=\"stMetricValue\"], [data-testid=\"stMetricLabel\"],\n[data-testid=\"stWidgetLabel\"] {\n  font-family: 'Inter', system-ui, -apple-system, \"Segoe UI\", sans-serif;\n}\n\n/* 背景グラデ（portfolio-hub .portfolio-shell 相当） */\n.stApp {\n  background:\n    linear-gradient(180deg, rgba(248,250,252,0.92), rgba(241,245,249,0.96) 42%, rgba(15,23,42,0.05)),\n    radial-gradient(circle at 50% 0%, rgba(255,255,255,0.95), rgba(219,234,254,0.55) 42%, rgba(15,23,42,0.06));\n  color: var(--fg);\n}\n\n/* Streamlit クロームを控えめに */\nheader[data-testid=\"stHeader\"] { background: transparent; }\n[data-testid=\"stToolbar\"], #MainMenu, footer { visibility: hidden; height: 0; }\n[data-testid=\"stDecoration\"] { display: none; }\n\n/* 本文幅と余白 */\n.block-container, [data-testid=\"stMainBlockContainer\"] {\n  max-width: 1180px; padding-top: 2.2rem; padding-bottom: 3rem;\n}\n\n/* 見出し */\nh1 { font-weight: 800 !important; letter-spacing: -0.02em; line-height: 1.05; color: var(--fg); }\nh2 { font-weight: 700 !important; letter-spacing: -0.01em; color: var(--fg); }\nh3 { font-weight: 700 !important; color: var(--fg); }\n\n/* Hero ブロック */\n.brand-hero { margin: 6px 0 30px; }\n.brand-kicker {\n  color: var(--accent); font-size: .78rem; font-weight: 700;\n  letter-spacing: .15em; text-transform: uppercase; margin-bottom: 10px;\n}\n.brand-title {\n  font-size: clamp(2.1rem, 5vw, 3.5rem); font-weight: 800;\n  line-height: 1.03; letter-spacing: -0.025em; color: var(--fg); margin: 0;\n}\n.brand-sub {\n  color: var(--muted); font-size: 1.02rem; line-height: 1.8;\n  margin-top: 14px; max-width: 760px;\n}\n\n/* サイドバー = 半透明サーフェス */\n[data-testid=\"stSidebar\"] {\n  background: rgba(255,255,255,0.72); backdrop-filter: blur(16px);\n  border-right: 1px solid var(--line);\n}\n[data-testid=\"stSidebar\"] .brand-kicker { margin-top: 4px; }\n\n/* metric をカード化 */\n[data-testid=\"stMetric\"] {\n  background: var(--surface); border: 1px solid var(--line);\n  border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow);\n  backdrop-filter: blur(12px);\n}\n[data-testid=\"stMetricValue\"] { color: var(--fg); font-weight: 800; }\n[data-testid=\"stMetricLabel\"] { color: var(--muted); }\n\n/* ボタン = ダークプライマリ */\n.stButton > button, .stDownloadButton > button, .stFormSubmitButton > button {\n  border-radius: 8px; border: 1px solid #0f172a; background: #0f172a;\n  color: #fff; font-weight: 700; padding: 8px 16px;\n  transition: transform .15s ease, background .15s ease;\n}\n.stButton > button:hover, .stDownloadButton > button:hover,\n.stFormSubmitButton > button:hover {\n  background: #020617; transform: translateY(-1px); border-color: #0f172a; color: #fff;\n}\n\n/* タブ */\n.stTabs [data-baseweb=\"tab-list\"] { gap: 6px; border-bottom: 1px solid var(--line); }\n.stTabs [data-baseweb=\"tab\"] { font-weight: 700; color: var(--muted); }\n.stTabs [aria-selected=\"true\"] { color: var(--fg); }\n\n/* 表・expander をカード化 */\n[data-testid=\"stDataFrame\"], [data-testid=\"stTable\"] {\n  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\n  box-shadow: var(--shadow);\n}\n[data-testid=\"stExpander\"] {\n  border: 1px solid var(--line); border-radius: 12px;\n  background: var(--surface); box-shadow: var(--shadow);\n}\n\n/* 入力の角丸 */\n[data-baseweb=\"select\"] > div, .stTextInput input, .stTextArea textarea,\n.stNumberInput input { border-radius: 8px !important; }\n\n/* 通知・区切り */\n[data-testid=\"stNotification\"], .stAlert { border-radius: 10px; }\nhr { border-color: var(--line); }\n</style>\n\"\"\"\n\n\ndef apply_brand(st) -> None:\n    \"\"\"ブランド CSS を注入する。``st.set_page_config`` の後に一度だけ呼ぶ。\"\"\"\n    st.markdown(_BRAND_CSS, unsafe_allow_html=True)\n\n\ndef _esc(text: str) -> str:\n    return (\n        str(text)\n        .replace(\"&\", \"&amp;\")\n        .replace(\"<\", \"&lt;\")\n        .replace(\">\", \"&gt;\")\n    )\n\n\ndef hero(st, kicker: str, title: str, subtitle: str | None = None) -> None:\n    \"\"\"portfolio-hub 風のヒーロー見出し（キッカー + 大見出し + サブ説明）。\"\"\"\n    html = (\n        '<div class=\"brand-hero\">'\n        f'<div class=\"brand-kicker\">{_esc(kicker)}</div>'\n        f'<div class=\"brand-title\">{_esc(title)}</div>'\n    )\n    if subtitle:\n        html += f'<div class=\"brand-sub\">{_esc(subtitle)}</div>'\n    html += \"</div>\"\n    st.markdown(html, unsafe_allow_html=True)\n", "src/data.py": "\"\"\"仮想データの生成。\n\n全データは seed 固定で合成した架空の地点。実在クライアントの計画とは無関係。\n地名は一般化し、座標は中立的な範囲に配置する。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom .models import DemandPoint, SupplyFacility\n\n_LAT_RANGE = (35.05, 35.95)\n_LON_RANGE = (139.55, 140.45)\n_DEMAND_RANGE = (60, 520)\n_BASE_SEED = 42\n\n\ndef generate_demand_points(n: int, seed: int = _BASE_SEED) -> list[DemandPoint]:\n    \"\"\"需要地点を seed 固定で合成する。\n\n    Args:\n        n: 生成する地点数。\n        seed: 乱数シード。\n\n    Returns:\n        合成された需要地点のリスト。\n    \"\"\"\n    if n < 0:\n        raise ValueError(\"地点数は0以上である必要があります\")\n    rng = np.random.default_rng(seed)\n    lats = rng.uniform(_LAT_RANGE[0], _LAT_RANGE[1], n)\n    lons = rng.uniform(_LON_RANGE[0], _LON_RANGE[1], n)\n    demands = rng.integers(_DEMAND_RANGE[0], _DEMAND_RANGE[1] + 1, n)\n    points: list[DemandPoint] = []\n    for i in range(n):\n        points.append(\n            DemandPoint(\n                id=f\"D-{i + 1:02d}\",\n                name=f\"Zone D-{i + 1:02d}\",\n                lat=float(lats[i]),\n                lon=float(lons[i]),\n                demand=int(demands[i]),\n            )\n        )\n    return points\n\n\ndef scale_demand(points: list[DemandPoint], scale: float) -> list[DemandPoint]:\n    \"\"\"需要量を一括スケールする（シナリオ peak 等で使用）。\n\n    Args:\n        points: 元の需要地点リスト。\n        scale: スケール係数（>0）。\n\n    Returns:\n        需要量をスケールした新しい需要地点リスト。\n    \"\"\"\n    if scale <= 0:\n        raise ValueError(\"スケールは正の値である必要があります\")\n    return [\n        DemandPoint(\n            id=p.id,\n            name=p.name,\n            lat=p.lat,\n            lon=p.lon,\n            demand=round(p.demand * scale, 1),\n        )\n        for p in points\n    ]\n\n\n# ベース供給拠点（seed固定ではなく固定配置。容量ゼロ拠点を1つ含めて堅牢性確認用にする）\nBASE_FACILITIES: list[SupplyFacility] = [\n    SupplyFacility(id=\"H-01\", name=\"Hub H-01\", lat=35.45, lon=139.75, capacity=1800),\n    SupplyFacility(id=\"H-02\", name=\"Hub H-02\", lat=35.70, lon=140.05, capacity=1500),\n    SupplyFacility(id=\"H-03\", name=\"Hub H-03\", lat=35.20, lon=140.20, capacity=1200),\n    SupplyFacility(id=\"H-04\", name=\"Hub H-04\", lat=35.85, lon=139.65, capacity=0),\n    SupplyFacility(id=\"H-05\", name=\"Hub H-05\", lat=35.35, lon=140.35, capacity=900),\n]\n\n# expansion シナリオで追加する拠点\nEXTRA_FACILITIES: list[SupplyFacility] = [\n    SupplyFacility(id=\"H-06\", name=\"Hub H-06 (new)\", lat=35.60, lon=139.90, capacity=1400),\n    SupplyFacility(id=\"H-07\", name=\"Hub H-07 (new)\", lat=35.15, lon=139.85, capacity=1000),\n]\n\n\ndef get_base_facilities() -> list[SupplyFacility]:\n    \"\"\"ベース供給拠点のコピーを返す。\"\"\"\n    return list(BASE_FACILITIES)\n\n\ndef get_expansion_facilities() -> list[SupplyFacility]:\n    \"\"\"ベース + 追加の供給拠点を返す。\"\"\"\n    return list(BASE_FACILITIES) + list(EXTRA_FACILITIES)\n", "src/models.py": "\"\"\"データモデル定義。\n\n需要地点・供給拠点・割当結果を表す dataclass を提供する。\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\n\n@dataclass(frozen=True)\nclass DemandPoint:\n    \"\"\"需要地点。\n\n    Attributes:\n        id: 一意識別子。\n        name: 表示用名称（一般化した仮想地名）。\n        lat: 緯度。\n        lon: 経度。\n        demand: 需要量（>=0）。\n    \"\"\"\n\n    id: str\n    name: str\n    lat: float\n    lon: float\n    demand: float\n\n\n@dataclass(frozen=True)\nclass SupplyFacility:\n    \"\"\"供給拠点。\n\n    容量ゼロの拠点も許容する（休止拠点として扱い、落ちないようにする）。\n\n    Attributes:\n        id: 一意識別子。\n        name: 表示用名称。\n        lat: 緯度。\n        lon: 経度。\n        capacity: 容量上限（>=0）。\n    \"\"\"\n\n    id: str\n    name: str\n    lat: float\n    lon: float\n    capacity: float\n\n\n@dataclass(frozen=True)\nclass Assignment:\n    \"\"\"1件の割当。\n\n    Attributes:\n        demand_id: 需要地点ID。\n        facility_id: 割当先拠点ID。\n        amount: 割当量。\n        distance_km: 地点と拠点間の直線距離(km)。\n    \"\"\"\n\n    demand_id: str\n    facility_id: str\n    amount: float\n    distance_km: float\n\n\n@dataclass(frozen=True)\nclass Unassigned:\n    \"\"\"割当できなかった需要。\n\n    Attributes:\n        demand_id: 需要地点ID。\n        amount: 未割当量。\n        nearest_facility_id: 最も近い拠点ID（参考）。\n        nearest_distance_km: 最寄り拠点までの距離(km)。\n    \"\"\"\n\n    demand_id: str\n    amount: float\n    nearest_facility_id: str\n    nearest_distance_km: float\n\n\n@dataclass\nclass AssignmentResult:\n    \"\"\"割当計算の全体結果。\n\n    Attributes:\n        assignments: 成立した割当のリスト。\n        unassigned: 容量不足で割当できなかった需要。\n        facility_loads: 拠点ID -> 割当済合計量。\n        facility_capacities: 拠点ID -> 容量。\n    \"\"\"\n\n    assignments: list[Assignment] = field(default_factory=list)\n    unassigned: list[Unassigned] = field(default_factory=list)\n    facility_loads: dict[str, float] = field(default_factory=dict)\n    facility_capacities: dict[str, float] = field(default_factory=dict)\n\n    @property\n    def total_demand(self) -> float:\n        \"\"\"総需要（割当済 + 未割当）。\"\"\"\n        return sum(a.amount for a in self.assignments) + sum(\n            u.amount for u in self.unassigned\n        )\n\n    @property\n    def total_assigned(self) -> float:\n        \"\"\"割当済需要合計。\"\"\"\n        return sum(a.amount for a in self.assignments)\n\n    @property\n    def total_capacity(self) -> float:\n        \"\"\"総容量。\"\"\"\n        return sum(self.facility_capacities.values())\n\n    @property\n    def total_unassigned(self) -> float:\n        \"\"\"未割当（容量不足）需要合計。\"\"\"\n        return sum(u.amount for u in self.unassigned)\n\n    @property\n    def total_surplus(self) -> float:\n        \"\"\"総余剰容量。\"\"\"\n        return sum(\n            max(0.0, self.facility_capacities.get(fid, 0.0) - load)\n            for fid, load in self.facility_loads.items()\n        )\n\n    @property\n    def avg_distance_km(self) -> float:\n        \"\"\"割当済の需要重み付き平均距離(km)。割当が無ければ0。\"\"\"\n        total = self.total_assigned\n        if total <= 0:\n            return 0.0\n        return sum(a.amount * a.distance_km for a in self.assignments) / total\n\n    @property\n    def utilization_rate(self) -> float:\n        \"\"\"総容量に対する割当済の割合(0-1)。容量0の時は0。\"\"\"\n        cap = self.total_capacity\n        if cap <= 0:\n            return 0.0\n        return min(1.0, self.total_assigned / cap)\n", "src/scenarios.py": "\"\"\"シナリオ定義。\n\n需要スケールと拠点構成の組み合わせで複数シナリオを提供し、\n画面で切り替えて結果を比較できるようにする。\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nfrom .data import (\n    generate_demand_points,\n    get_base_facilities,\n    get_expansion_facilities,\n    scale_demand,\n)\nfrom .models import DemandPoint, SupplyFacility\n\n_DEFAULT_N_DEMAND = 24\n_PEAK_SCALE = 1.6\n\n\n@dataclass(frozen=True)\nclass Scenario:\n    \"\"\"1シナリオの定義。\n\n    Attributes:\n        key: シナリオ識別子。\n        name: 表示名。\n        description: シナリオの説明。\n        demand_points: 需要地点リスト。\n        facilities: 供給拠点リスト。\n    \"\"\"\n\n    key: str\n    name: str\n    description: str\n    demand_points: list[DemandPoint]\n    facilities: list[SupplyFacility]\n\n\ndef build_scenarios(n_demand: int = _DEFAULT_N_DEMAND) -> dict[str, Scenario]:\n    \"\"\"全シナリオを構築して返す。\n\n    Args:\n        n_demand: 需要地点数（地点数を増やしても UI が崩れないか確認用）。\n\n    Returns:\n        シナリオキー -> Scenario の辞書。\n    \"\"\"\n    if n_demand < 0:\n        raise ValueError(\"需要地点数は0以上である必要があります\")\n\n    base_demand = generate_demand_points(n_demand)\n    base_fac = get_base_facilities()\n    exp_fac = get_expansion_facilities()\n\n    return {\n        \"baseline\": Scenario(\n            key=\"baseline\",\n            name=\"Baseline\",\n            description=\"標準需要と既存拠点構成（現状）。\",\n            demand_points=list(base_demand),\n            facilities=list(base_fac),\n        ),\n        \"peak\": Scenario(\n            key=\"peak\",\n            name=\"Peak Demand\",\n            description=f\"需要を {_PEAK_SCALE}x に増加。既存拠点でどこまで耐えるか。\",\n            demand_points=scale_demand(base_demand, _PEAK_SCALE),\n            facilities=list(base_fac),\n        ),\n        \"expansion\": Scenario(\n            key=\"expansion\",\n            name=\"Expansion\",\n            description=\"需要は標準のまま拠点を2件追加。余剰とカバレッジの変化を比較。\",\n            demand_points=list(base_demand),\n            facilities=list(exp_fac),\n        ),\n    }\n\n\ndef scenario_order() -> list[str]:\n    \"\"\"表示順に並べたシナリオキー。\"\"\"\n    return [\"baseline\", \"peak\", \"expansion\"]\n", ".streamlit/config.toml": "[theme]\nbase = \"light\"\nprimaryColor = \"#0f766e\"\nbackgroundColor = \"#f8fafc\"\nsecondaryBackgroundColor = \"#ffffff\"\ntextColor = \"#0f172a\"\nfont = \"sans serif\"\n"}}, document.getElementById("root"));
</script>
